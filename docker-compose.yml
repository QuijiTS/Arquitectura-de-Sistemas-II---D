version: '3.8'

services:
  web1:
    image: nginx:alpine
    container_name: server1
    volumes:
      - ./server1/index.html:/usr/share/nginx/html/index.html:ro

  web2:
    image: nginx:alpine
    container_name: server2
    volumes:
      - ./server2/index.html:/usr/share/nginx/html/index.html:ro

  loadbalancer:
    image: nginx:alpine
    container_name: nginx_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
