apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portafolio-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/QuijiTS/Arquitectura-de-Sistemas-II---D.git'
    targetRevision: assignment-08
    path: k8s-manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
